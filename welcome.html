<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello from Sygna</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0b1020 0%, #111827 55%, #050816 100%);
        color: #e5e7eb;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 680px);
        padding: 3rem 2rem;
        text-align: center;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 20px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: #f9fafb;
      }

      p {
        margin: 0;
        font-size: clamp(1.05rem, 2.2vw, 1.25rem);
        line-height: 1.7;
        color: #cbd5e1;
      }

      .accent {
        color: #7dd3fc;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Sygna</h1>
      <p>
        Welcome to <span class="accent">Software Factory</span>.
        This is a simple dark landing page created for the mission.
      </p>
    </main>
  </body>
</html>
